name: "VibeSafe"
description: "Scan a pull request for vibe-coding security and quality issues and post a sticky review comment."
author: "Talal Jaber"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan, relative to the repository root."
    required: false
    default: "."
  fail-on:
    description: "Fail the job at this deploy status or worse: blocker, danger, warning or none."
    required: false
    default: "blocker"
  comment:
    description: "Post or update a sticky pull request comment with the results (true or false)."
    required: false
    default: "true"
  github-token:
    description: "Token used to post the comment. Needs pull-requests: write. Use the default token or a GitHub App token; the sticky comment is matched by the token's own login, so a personal access token also works."
    required: false
    default: ${{ github.token }}
  deep:
    description: "Also scan git history for leaked secrets (needs fetch-depth: 0 on checkout)."
    required: false
    default: "false"
  version:
    description: "Deprecated and ignored. The action builds VibeSafe from its own source at the ref you pin in `uses:`; pick the version with that ref."
    required: false
    deprecationMessage: "The 'version' input is ignored. The action runs VibeSafe built from its own source at the ref pinned in 'uses:'. Remove the input and pin a release tag or commit SHA instead."
  node-version:
    description: "Node.js version used to build and run VibeSafe (20.19+, 22.14+ or 24; it must ship a corepack that can verify pnpm)."
    required: false
    default: "20"

outputs:
  status:
    description: "Deploy status: safe, warning, danger or blocker."
    value: ${{ steps.scan.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}

    # hashFiles() only reads inside GITHUB_WORKSPACE, and the action's own files live outside
    # it when the action is used from another repository, so hash the lockfile here.
    - name: Compute the VibeSafe build cache key
      id: cache-key
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        hash="$(node -e 'process.stdout.write(require("crypto").createHash("sha256").update(require("fs").readFileSync("pnpm-lock.yaml")).update(String(require("./package.json").packageManager)).digest("hex"))')"
        echo "key=vibesafe-pnpm-store-${RUNNER_OS}-${RUNNER_ARCH}-${hash}" >> "$GITHUB_OUTPUT"

    # Cache the private pnpm store used by the build below. The key only depends on the
    # action's own lockfile and pnpm version, never on the scanned repository. The store is
    # only saved when the job succeeds. GitHub scopes caches by
    # branch: a pull request can read its base branch's cache but only writes its own.
    - name: Cache the VibeSafe pnpm store
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/vibesafe-build/store
        key: ${{ steps.cache-key.outputs.key }}

    # Build the CLI from this action's own source (the ref pinned in `uses:`) instead of
    # running a package from npm. The project does not publish to npm, and the npm name
    # @vibesafe/cli belongs to an unrelated package.
    - name: Build VibeSafe from the action source
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      run: |
        set -euo pipefail
        if ! command -v corepack >/dev/null 2>&1; then
          echo "::error::corepack was not found. Use a node-version that ships corepack (Node 20.19+, 22.14+ or 24)."
          exit 2
        fi

        # Run from the action directory only, with npm config from the runner and the
        # (untrusted) scanned repository ignored, the public registry, the action's own
        # lockfile as-is, a private store and no dependency install scripts.
        builddir="$RUNNER_TEMP/vibesafe-build"
        mkdir -p "$builddir"
        : > "$builddir/empty.npmrc"
        export NPM_CONFIG_USERCONFIG="$builddir/empty.npmrc"
        export NPM_CONFIG_GLOBALCONFIG="$builddir/empty.npmrc"
        export NPM_CONFIG_REGISTRY="https://registry.npmjs.org/"
        export NPM_CONFIG_UPDATE_NOTIFIER="false"
        export COREPACK_NPM_REGISTRY="https://registry.npmjs.org"

        # corepack runs the pnpm version pinned (with its sha512 hash) by packageManager in the
        # action's package.json. pnpm 9 defaults dedupe-peer-dependents to true, which pulls the
        # dependencies of every workspace package into a filtered install; turn it off so only
        # the CLI and its workspace dependencies (shared, core) are installed.
        corepack pnpm install --frozen-lockfile --ignore-scripts --filter "@vibesafe/cli..." \
          --config.dedupe-peer-dependents=false --store-dir "$builddir/store"
        corepack pnpm --filter "@vibesafe/cli..." run build
        test -f packages/cli/dist/bin.js

    - name: Run VibeSafe scan
      id: scan
      shell: bash
      env:
        VS_PATH: ${{ inputs.path }}
        VS_DEEP: ${{ inputs.deep }}
        VS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -u
        case "$VS_FAIL_ON" in
          blocker|danger|warning|none) ;;
          *) echo "::error::Invalid fail-on '$VS_FAIL_ON'. Use blocker, danger, warning or none."; exit 2 ;;
        esac

        case "$VS_PATH" in
          /*|..|../*|*/..|*/../*) echo "::error::Invalid path '$VS_PATH'. It must be relative and stay inside the workspace."; exit 2 ;;
        esac

        report="$RUNNER_TEMP/vibesafe-report.md"
        errlog="$RUNNER_TEMP/vibesafe-stderr.log"
        args=(scan --format markdown)
        if [ "$VS_DEEP" = "true" ]; then args+=(--deep); fi
        args+=(-- "$GITHUB_WORKSPACE/$VS_PATH")

        # Run the CLI built in the previous step from a clean directory outside the
        # scanned repository; the repository is only passed as the path to scan.
        cli="$GITHUB_ACTION_PATH/packages/cli/dist/bin.js"
        rundir="$RUNNER_TEMP/vibesafe-run"
        mkdir -p "$rundir"
        cd "$rundir"

        # The CLI exits 1 on blocker/danger and 2 on a scan error; fail-on decides below.
        set +e
        node "$cli" "${args[@]}" > "$report" 2> "$errlog"
        code=$?
        set -e

        status="$(sed -n 's/^<!-- vibesafe-status:\([a-z]*\) -->$/\1/p' "$report" | head -n 1)"
        if [ "$code" -ge 2 ] || [ -z "$status" ]; then
          echo "::error::VibeSafe scan failed to run (exit code $code)."
          head -c 4000 "$errlog" || true
          exit 2
        fi

        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"

        # Rank statuses so fail-on means "this status or worse".
        rank() { case "$1" in safe) echo 0 ;; warning) echo 1 ;; danger) echo 2 ;; blocker) echo 3 ;; esac; }
        if [ "$VS_FAIL_ON" = "none" ]; then
          threshold=99
        else
          threshold="$(rank "$VS_FAIL_ON")"
        fi
        if [ "$(rank "$status")" -ge "$threshold" ]; then
          echo "fail=true" >> "$GITHUB_OUTPUT"
        else
          echo "fail=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Post or update pull request comment
      if: ${{ always() && inputs.comment == 'true' && github.event.pull_request.number && steps.scan.outputs.report }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        marker="<!-- vibesafe-pr-comment -->"
        # Comments cannot be written from fork PRs with a read-only token; do not fail the job for that.
        # Only adopt bot-written comments that start with the marker, never a user's quote of it.
        # Match on the token's own identity: the default/App token is a Bot, a PAT is a User.
        me="$(gh api user --jq .login 2>/dev/null || true)"
        [ -z "$me" ] && me="github-actions[bot]"
        id="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null \
          | jq -r --arg m "$marker" --arg me "$me" '.[] | select((.user.login == $me or .user.login == "github-actions[bot]") and (.body | startswith($m))) | .id' 2>/dev/null \
          | head -n 1 || true)"

        if [ -n "$id" ]; then
          if gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$REPORT" >/dev/null 2>&1; then
            echo "Updated VibeSafe comment $id"
          else
            echo "::warning::Could not update VibeSafe comment $id. The report is in the job summary."
          fi
        elif gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$REPORT" >/dev/null 2>&1; then
          echo "Posted VibeSafe comment"
        else
          echo "::warning::Could not post the VibeSafe comment (missing pull-requests: write, or a fork PR). The report is in the job summary."
        fi

    - name: Apply fail-on
      if: ${{ steps.scan.outputs.fail == 'true' }}
      shell: bash
      env:
        VS_STATUS: ${{ steps.scan.outputs.status }}
        VS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::VibeSafe deploy status is '$VS_STATUS' (fail-on: $VS_FAIL_ON)."
        exit 1
