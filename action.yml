name: "VibeSafe"
description: "Scan a pull request for vibe-coding security and quality issues and post a sticky review comment."
author: "Talal Jaber"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Directory to scan, relative to the repository root."
    required: false
    default: "."
  fail-on:
    description: "Fail the job at this deploy status or worse: blocker, danger, warning or none."
    required: false
    default: "blocker"
  comment:
    description: "Post or update a sticky pull request comment with the results (true or false)."
    required: false
    default: "true"
  github-token:
    description: "Token used to post the comment. Needs pull-requests: write. Use the default token or a GitHub App token; the sticky comment is matched by the token's own login, so a personal access token also works."
    required: false
    default: ${{ github.token }}
  deep:
    description: "Also scan git history for leaked secrets (needs fetch-depth: 0 on checkout)."
    required: false
    default: "false"
  version:
    description: "Version of @vibesafe/cli to run via npx. Needs 0.3.0 or later, the first release with --format markdown (not yet published to npm at the time of writing). Prefer a pinned version over latest."
    required: false
    default: "0.3.0"
  node-version:
    description: "Node.js version to use."
    required: false
    default: "20"

outputs:
  status:
    description: "Deploy status: safe, warning, danger or blocker."
    value: ${{ steps.scan.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run VibeSafe scan
      id: scan
      shell: bash
      env:
        VS_PATH: ${{ inputs.path }}
        VS_VERSION: ${{ inputs.version }}
        VS_DEEP: ${{ inputs.deep }}
        VS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -u
        case "$VS_FAIL_ON" in
          blocker|danger|warning|none) ;;
          *) echo "::error::Invalid fail-on '$VS_FAIL_ON'. Use blocker, danger, warning or none."; exit 2 ;;
        esac

        case "$VS_PATH" in
          /*|..|../*|*/..|*/../*) echo "::error::Invalid path '$VS_PATH'. It must be relative and stay inside the workspace."; exit 2 ;;
        esac

        report="$RUNNER_TEMP/vibesafe-report.md"
        errlog="$RUNNER_TEMP/vibesafe-stderr.log"
        args=(scan --format markdown)
        if [ "$VS_DEEP" = "true" ]; then args+=(--deep); fi
        args+=(-- "$GITHUB_WORKSPACE/$VS_PATH")

        # Run npx from a clean directory with the repo's npm config ignored, so the
        # (untrusted) scanned repo cannot redirect the registry and run its own code.
        cleandir="$RUNNER_TEMP/vibesafe-npx"
        mkdir -p "$cleandir"
        : > "$cleandir/empty.npmrc"
        cd "$cleandir"
        export NPM_CONFIG_USERCONFIG="$cleandir/empty.npmrc"
        export NPM_CONFIG_GLOBALCONFIG="$cleandir/empty.npmrc"
        export NPM_CONFIG_REGISTRY="https://registry.npmjs.org/"

        # The CLI exits 1 on blocker/danger and 2 on a scan error; fail-on decides below.
        set +e
        npx --yes "@vibesafe/cli@${VS_VERSION}" "${args[@]}" > "$report" 2> "$errlog"
        code=$?
        set -e

        status="$(sed -n 's/^<!-- vibesafe-status:\([a-z]*\) -->$/\1/p' "$report" | head -n 1)"
        if [ "$code" -ge 2 ] || [ -z "$status" ]; then
          echo "::error::VibeSafe scan failed to run (exit code $code)."
          head -c 4000 "$errlog" || true
          exit 2
        fi

        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"

        # Rank statuses so fail-on means "this status or worse".
        rank() { case "$1" in safe) echo 0 ;; warning) echo 1 ;; danger) echo 2 ;; blocker) echo 3 ;; esac; }
        if [ "$VS_FAIL_ON" = "none" ]; then
          threshold=99
        else
          threshold="$(rank "$VS_FAIL_ON")"
        fi
        if [ "$(rank "$status")" -ge "$threshold" ]; then
          echo "fail=true" >> "$GITHUB_OUTPUT"
        else
          echo "fail=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Post or update pull request comment
      if: ${{ always() && inputs.comment == 'true' && github.event.pull_request.number && steps.scan.outputs.report }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.scan.outputs.report }}
      run: |
        marker="<!-- vibesafe-pr-comment -->"
        # Comments cannot be written from fork PRs with a read-only token; do not fail the job for that.
        # Only adopt bot-written comments that start with the marker, never a user's quote of it.
        # Match on the token's own identity: the default/App token is a Bot, a PAT is a User.
        me="$(gh api user --jq .login 2>/dev/null || true)"
        [ -z "$me" ] && me="github-actions[bot]"
        id="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate 2>/dev/null \
          | jq -r --arg m "$marker" --arg me "$me" '.[] | select((.user.login == $me or .user.login == "github-actions[bot]") and (.body | startswith($m))) | .id' 2>/dev/null \
          | head -n 1 || true)"

        if [ -n "$id" ]; then
          if gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$REPORT" >/dev/null 2>&1; then
            echo "Updated VibeSafe comment $id"
          else
            echo "::warning::Could not update VibeSafe comment $id. The report is in the job summary."
          fi
        elif gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$REPORT" >/dev/null 2>&1; then
          echo "Posted VibeSafe comment"
        else
          echo "::warning::Could not post the VibeSafe comment (missing pull-requests: write, or a fork PR). The report is in the job summary."
        fi

    - name: Apply fail-on
      if: ${{ steps.scan.outputs.fail == 'true' }}
      shell: bash
      env:
        VS_STATUS: ${{ steps.scan.outputs.status }}
        VS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::VibeSafe deploy status is '$VS_STATUS' (fail-on: $VS_FAIL_ON)."
        exit 1
