name: Action self-test

# Runs the composite action from this checkout (`uses: ./`) on every runner OS against the
# deliberately insecure fixture app, so the bash steps are exercised on Linux, macOS and
# Windows (Git Bash) before a release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "action.yml"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/action-self-test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: uses ./ on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run the action against the fixture app
        id: vibesafe
        uses: ./
        with:
          path: fixtures/nextjs-vibecoded-bad-app
          comment: "false"
          fail-on: none

      - name: Check the action outputs
        shell: bash
        env:
          VS_STATUS: ${{ steps.vibesafe.outputs.status }}
        run: |
          set -euo pipefail
          if [ -z "$VS_STATUS" ]; then
            echo "::error::The action did not set outputs.status."
            exit 1
          fi
          case "$VS_STATUS" in
            safe|warning|danger|blocker) echo "VibeSafe status: $VS_STATUS" ;;
            *) echo "::error::Unexpected status '$VS_STATUS'."; exit 1 ;;
          esac
